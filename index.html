<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Sunlight</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1 data-i18n="appTitle">Omega Sunlight</h1>
        <button id="settingsBtn" aria-label="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </header>

    <main>
        <div class="chart-container">
            <canvas id="sunlightChart"></canvas>
        </div>
        <div id="loading" class="hidden" data-i18n="loading">Loading...</div>
        <div id="error" class="hidden error-message"></div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <h2 data-i18n="settingsTitle">Settings</h2>
            
            <form id="settingsForm">
                <div class="form-group">
                    <label for="lat" data-i18n="latitude">Latitude</label>
                    <input type="number" id="lat" step="any" required>
                </div>
                
                <div class="form-group">
                    <label for="lon" data-i18n="longitude">Longitude</label>
                    <input type="number" id="lon" step="any" required>
                </div>

                <div class="form-group">
                    <label for="theme" data-i18n="theme">Theme</label>
                    <select id="theme">
                        <option value="system" data-i18n="themeSystem">System</option>
                        <option value="light" data-i18n="themeLight">Light</option>
                        <option value="dark" data-i18n="themeDark">Dark</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="language" data-i18n="language">Language</label>
                    <select id="language">
                        <option value="system" data-i18n="langSystem">System</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" id="closeSettingsBtn" class="btn btn-secondary" data-i18n="cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" data-i18n="save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
